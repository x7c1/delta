# Weekly update PRs. For the workflows this keeps the pinned commit SHAs (and
# their `# vX.Y.Z` comments) current; see docs/guides/development/README.md
# ("Workflows and dependency audit").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
