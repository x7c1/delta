name: Release

# Cuts a Release when CI passes on a main commit that changed the workspace
# version. The jobs split by what they may write or read:
#
#   plan (read) → draft (contents: write, gh only) → bundles (read, builds)
#     → sign (no token; the signing key, minisign only)
#     → publish (contents: write, attestations; gh and pinned actions only)
#     → rewrite-links (pull-requests: write)
#
# Only `draft` and `publish` can change a Release, and neither checks out or
# runs project code; the jobs that build hold read access only. Only `sign`
# can read the release signing key (the `release-signing` environment), and
# it holds no token and runs no project code either. The Release stays a
# draft — invisible to the desktop app's update check, and with no tag yet —
# until every bundle and its signature is attached. See
# docs/guides/release.md ("Desktop bundles", "Signing").

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  # A dry run of the whole pipeline from the dispatched ref: a draft under a
  # tag name no release uses, with the bundles attached, never published.
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Must stay checked: a dispatched run is always a dry run. Real
          releases come only from a green CI run on main.
        type: boolean
        default: true

# Every job states what it needs.
permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only consider main runs that finished green: a red CI must never
    # tag a release.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      pull-requests: read

    outputs:
      release: ${{ steps.target.outputs.release }}
      dry_run: ${{ steps.target.outputs.dry_run }}
      version: ${{ steps.target.outputs.version }}
      bundles: ${{ steps.names.outputs.bundles }}
      tag: ${{ steps.target.outputs.tag }}
      title: ${{ steps.target.outputs.title }}
      sha: ${{ steps.target.outputs.sha }}
      body: ${{ steps.summary.outputs.body || steps.dry-run.outputs.body }}

    env:
      # The commit CI tested, not the branch tip: another merge may have
      # landed on main since that CI run started.
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Refuse a dispatched release that is not a dry run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          echo "::error::A dispatched Release run is always a dry run; real releases come from a green CI run on main. See docs/guides/release.md."
          exit 1

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # cargo metadata reads the manifest, so the toolchain has to be
      # available even when the version turns out to be unchanged.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - name: Check if version changed
        if: github.event_name == 'workflow_run'
        id: version-check
        run: ./scripts/check-version-change.sh

      # The Release body is the summary a developer wrote in the release PR,
      # not the per-commit changelog — that stays on the PR itself (layout:
      # docs/guides/release.md). This step runs before the draft is created,
      # so a missing summary aborts the run instead of producing a Release
      # nobody can read.
      - name: Resolve release summary
        if: steps.version-check.outputs.changed == 'true'
        id: summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          source .github/scripts/release-summary.sh
          source .github/scripts/release-pr-lookup.sh

          repo_url=$(gh repo view --json url --jq '.url')
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          pr_number=$(find_release_pr "$NEW_VERSION")
          if [ -z "$pr_number" ]; then
            echo "::error::No merged release PR found for v${NEW_VERSION}; its summary region is what this Release publishes. See docs/guides/release.md."
            exit 1
          fi

          # Fetch in a statement of its own so a failed API call aborts the
          # step rather than reading as an unwritten summary.
          pr_body=$(gh pr view "$pr_number" --json body --jq '.body')
          summary=$(summary_region "$pr_body")
          if summary_is_unwritten "$summary"; then
            echo "::error::Release PR #${pr_number} carries no release summary. Write it above the '$(changelog_marker)' marker in the PR body and delete the '$(summary_sentinel)' comment, then re-run this workflow. See docs/guides/release.md."
            exit 1
          fi

          # Randomize the heredoc delimiter: the summary is free-form prose
          # and must not be able to terminate its own output block.
          delimiter="RELEASE_BODY_$(openssl rand -hex 16)"

          {
            echo "body<<${delimiter}"
            printf '%s\n\n---\n\n' "$summary"
            printf -- '- Full changelog: %s/pull/%s\n' "$repo_url" "$pr_number"
            if [ -n "$last_tag" ]; then
              printf -- '- Compare: [%s...v%s](%s/compare/%s...v%s)\n' \
                "$last_tag" "$NEW_VERSION" \
                "$repo_url" "$last_tag" "$NEW_VERSION"
            fi
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # A dry run builds whatever version the dispatched ref carries; the
      # bundle file names, which the sign and publish jobs check, use it.
      - name: Read the dry run's version
        if: github.event_name == 'workflow_dispatch'
        id: dry-run
        working-directory: backend
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "delta-server") | .version')
          test -n "$version"
          {
            echo "version=${version}"
            echo "body=Dry run of the Release workflow (run ${GITHUB_RUN_ID}, ${RELEASE_SHA}). Not a release: delete this draft once inspected."
          } >> "$GITHUB_OUTPUT"

      # The dry run's tag cannot collide with a release tag: no release
      # version is 0.0.0, and the run id makes it unique per run.
      - name: Resolve the release target
        id: target
        env:
          CHANGED: ${{ steps.version-check.outputs.changed }}
          RELEASE_VERSION: ${{ steps.version-check.outputs.version }}
          DRY_RUN_VERSION: ${{ steps.dry-run.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            {
              echo "release=true"
              echo "dry_run=true"
              echo "version=${DRY_RUN_VERSION}"
              echo "tag=v0.0.0-dryrun.${GITHUB_RUN_ID}"
              echo "title=Dry run ${GITHUB_RUN_ID} (not a release)"
            } >> "$GITHUB_OUTPUT"
          elif [ "$CHANGED" = true ]; then
            {
              echo "release=true"
              echo "dry_run=false"
              echo "version=${RELEASE_VERSION}"
              echo "tag=v${RELEASE_VERSION}"
              echo "title=Release v${RELEASE_VERSION}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      # The file names bundle.yml's matrix produces (docs/guides/release.md,
      # "Desktop bundles"), space-separated: exactly what `sign` signs and
      # `publish` requires. A platform missing here would be a bundle the
      # Release ships without.
      - name: Name the bundles
        id: names
        if: steps.target.outputs.release == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          echo "bundles=Delta_${VERSION}_aarch64.dmg delta-desktop_${VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"

  # A draft has no tag yet: GitHub creates it at target_commitish when the
  # draft is published. A whole-workflow re-run finds the draft it created
  # before and updates it instead of creating a second one.
  draft:
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create or update the draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
          SHA: ${{ needs.plan.outputs.sha }}
          BODY: ${{ needs.plan.outputs.body }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' "$BODY" > "$notes"

          # Empty when no Release (draft or not) carries the tag name.
          is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          case "$is_draft" in
            true)
              echo "Updating the existing draft ${TAG}."
              gh release edit "$TAG" --title "$TITLE" --notes-file "$notes" --target "$SHA"
              ;;
            false)
              echo "::error::${TAG} is already published; nothing to draft."
              exit 1
              ;;
            *)
              gh release create "$TAG" --draft --title "$TITLE" --notes-file "$notes" --target "$SHA"
              ;;
          esac

  bundles:
    needs: [plan, draft]
    if: ${{ needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/bundle.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      release: true

  # The only job that can read the release signing key: the secret of the
  # `release-signing` environment, which only protected branches may use. It
  # holds no token, checks nothing out and runs no project code; it installs
  # minisign from a pinned release archive checked against the sha256 below,
  # signs exactly the bundle names `plan` lists, verifies each signature
  # against the public key the desktop app compiles in, and hands the
  # signatures on as an artifact. The build jobs, which run project code,
  # never see the key. A dry run signs too, so the whole job is exercised.
  sign:
    needs: [plan, bundles]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    permissions: {}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUNDLES: ${{ needs.plan.outputs.bundles }}
      # minisign 0.12's Linux release archive (jedisct1/minisign), and its
      # sha256, taken when it was pinned (it also verified against the
      # author's minisign key then).
      MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
      # The public half of the signing key, as the desktop app and the update
      # helper compile it in (backend/crates/libs/release-signature). A
      # secret key that does not match it fails here, not in every app.
      MINISIGN_PUBLIC_KEY: RWSvjaqxlJm4wr9SiKBHDAlbhBASzeSf0dbg9loPJdgbTFQOEOX5J1Pl
    steps:
      # bundle.yml uploads one artifact per platform, delta-<matrix name>,
      # each holding that platform's single bundle file.
      - name: Download the bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: delta-*
          path: bundles
          merge-multiple: true

      - name: Install minisign
        run: |
          archive="${RUNNER_TEMP}/minisign.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$archive" "$MINISIGN_URL"
          echo "${MINISIGN_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          echo "${RUNNER_TEMP}/minisign-linux/x86_64" >> "$GITHUB_PATH"

      # The trusted comment, which the signature covers, names the file and
      # the version; the app refuses a signature naming anything else.
      - name: Sign the bundles
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The release-signing environment provides no MINISIGN_SECRET_KEY. See docs/guides/release.md (\"Signing\")."
            exit 1
          fi
          key="${RUNNER_TEMP}/release.key"
          trap 'rm -f "$key"' EXIT
          (
            umask 077
            # The secret holds the key file; a bare key line gets the
            # comment line minisign expects above it.
            case "$MINISIGN_SECRET_KEY" in
              "untrusted comment:"*) printf '%s\n' "$MINISIGN_SECRET_KEY" ;;
              *) printf 'untrusted comment: minisign secret key\n%s\n' "$MINISIGN_SECRET_KEY" ;;
            esac > "$key"
          )
          mkdir signatures
          read -ra expected <<< "$BUNDLES"
          for name in "${expected[@]}"; do
            if [ ! -f "bundles/${name}" ]; then
              echo "::error::The bundles job produced no ${name}."
              exit 1
            fi
            comment="file:${name} version:${VERSION}"
            minisign -S -s "$key" -m "bundles/${name}" \
              -x "signatures/${name}.minisig" -t "$comment" < /dev/null
            verified=$(minisign -V -Q -P "$MINISIGN_PUBLIC_KEY" \
              -m "bundles/${name}" -x "signatures/${name}.minisig")
            if [ "$verified" != "$comment" ]; then
              echo "::error::The signature of ${name} does not verify with the app's public key as \"${comment}\"."
              exit 1
            fi
            echo "Signed ${name}: ${comment}"
          done

      - name: Upload the signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-signatures
          path: signatures/*.minisig
          if-no-files-found: error
          # A re-run of the whole run signs again.
          overwrite: true

  # Runs no project code and no third-party action besides download-artifact
  # and attest-build-provenance: it only moves the files the bundles and sign
  # jobs produced onto the draft, checks them, records their build
  # provenance and publishes. A failed bundle leaves the draft unpublished;
  # "Re-run failed jobs" rebuilds the failed platforms, signs them and runs
  # this job again.
  publish:
    needs: [plan, sign]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # GitHub artifact attestations of the bundles, and nothing else.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      BUNDLES: ${{ needs.plan.outputs.bundles }}
    steps:
      # bundle.yml uploads one artifact per platform, delta-<matrix name>,
      # each holding that platform's single bundle file.
      - name: Download the bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: delta-*
          path: bundles
          merge-multiple: true

      - name: Download the signatures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundle-signatures
          path: bundles

      # The app refuses an update without its signature, so a bundle must
      # not reach the Release without one.
      - name: Check every bundle has its signature
        run: |
          read -ra expected <<< "$BUNDLES"
          missing=0
          for name in "${expected[@]}"; do
            for file in "$name" "${name}.minisig"; do
              if [ ! -f "bundles/${file}" ]; then
                echo "::error::Nothing to attach as ${file}."
                missing=1
              fi
            done
          done
          exit "$missing"

      # --clobber: a re-run replaces what an earlier attempt attached.
      - name: Attach the bundles and their signatures to the draft
        run: gh release upload "$TAG" bundles/* --clobber

      - name: Check every bundle and signature is attached
        run: |
          read -ra expected <<< "$BUNDLES"
          attached=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          printf 'Attached:\n%s\n' "$attached"
          missing=0
          for name in "${expected[@]}"; do
            for file in "$name" "${name}.minisig"; do
              if ! grep -qxF -- "$file" <<< "$attached"; then
                echo "::error::${TAG} lacks ${file}."
                missing=1
              fi
            done
          done
          exit "$missing"

      # Records, in GitHub's attestation store, which workflow run and
      # commit built each bundle (`gh attestation verify`). Not for a dry
      # run: an attestation is a lasting public statement, and a dry run may
      # build any protected ref.
      - name: Attest the bundles' build provenance
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bundles/*.dmg
            bundles/*.deb

      - name: Publish the Release
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        run: gh release edit "$TAG" --draft=false

  # Needs the tag, which exists only once the draft is published.
  rewrite-links:
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.release == 'true' && needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Rewrite release PR links to point at the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.plan.outputs.version }}
        run: .github/scripts/update-release-pr-links.sh "$NEW_VERSION"
