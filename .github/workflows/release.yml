name: Release

# Publishes a Release when CI passes on a main commit that is the squash of a
# merged release PR. colophon's reusable workflows decide the release (`plan`)
# and publish it (`publish`); in between, this workflow builds, signs and
# attests the desktop bundles. The jobs split by what they may write or read:
#
#   plan (colophon; read) → target (read) → bundles (read, builds)
#     → sign (no token; the signing key, minisign only)
#     → assets (attestations; download-artifact, attest and upload only)
#     → publish (colophon; contents: write, pull-requests: write)
#
# The jobs that build hold read access only. Only `sign` can read the release
# signing key (the `release-signing` environment), and it holds no token and
# runs no project code. `assets` fails unless every bundle and its signature
# is there, and hands them to `publish` as one artifact, which colophon
# attaches in the same `gh release create` that publishes the Release: the
# desktop app's update check never sees a Release that lacks a bundle or a
# signature. See docs/guides/release.md ("Desktop bundles", "Signing").

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  # A dry run from the dispatched ref: the bundles are built, signed with the
  # dry run's own version and checked, and left as workflow artifacts. No
  # Release, draft or otherwise, and no call to colophon.
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Must stay checked: a dispatched run is always a dry run. Real
          releases come only from a green CI run on main.
        type: boolean
        default: true

# Every job states what it needs.
permissions: {}

jobs:
  # Whether the commit CI judged is the squash of a merged PR labelled
  # `release`, and which version its title names. colophon considers only a
  # green CI run started by a push to this repository's main, and plans the
  # commit that run tested (`workflow_run.head_sha`), not the branch tip; it
  # fails, before anything is built, when the release PR carries no summary.
  plan:
    if: ${{ github.event_name == 'workflow_run' }}
    permissions:
      contents: read
      pull-requests: read
    uses: x7c1/colophon/.github/workflows/release-plan.yml@a4d0af8d30a36d9978d393e28b540bdb3c641c6f # v0.3.0
    with:
      version-scheme: semver

  # The commit to build, its version and the bundle names, for a release or a
  # dry run alike. `plan` is skipped on a dry run, hence `!cancelled()`; every
  # job after this one names the result it needs for the same reason.
  target:
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.plan.outputs.released == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dry_run: ${{ steps.target.outputs.dry_run }}
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}
      bundles: ${{ steps.names.outputs.bundles }}
    steps:
      - name: Refuse a dispatched release that is not a dry run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          echo "::error::A dispatched Release run is always a dry run; real releases come from a green CI run on main. See docs/guides/release.md."
          exit 1

      # The version the commit carries, which the bundles are built as and
      # named after. A dry run builds whatever version the dispatched ref
      # carries. A release names its version in the release PR's title, which
      # `plan` reads; the PR's commit wrote that version into the workspace,
      # but a refresh that failed after a title edit leaves the PR on the old
      # version, so the two are compared below before anything is built.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha || github.sha }}
          persist-credentials: false

      # `cargo metadata` below needs the toolchain; this installs the version
      # and components rust-toolchain.toml names.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Read the commit's version
        id: built
        working-directory: backend
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "delta-server") | .version')
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve the target
        id: target
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          BUILT_VERSION: ${{ steps.built.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            {
              echo "dry_run=true"
              echo "version=${BUILT_VERSION}"
              echo "sha=${GITHUB_SHA}"
            } >> "$GITHUB_OUTPUT"
          else
            if [ "$BUILT_VERSION" != "$RELEASE_VERSION" ]; then
              echo "::error::The release PR's title names v${RELEASE_VERSION}, but ${RELEASE_SHA} sets the workspace to ${BUILT_VERSION}. Nothing is built or tagged; see docs/guides/release.md (\"Recovery\")."
              exit 1
            fi
            {
              echo "dry_run=false"
              echo "version=${RELEASE_VERSION}"
              echo "sha=${RELEASE_SHA}"
            } >> "$GITHUB_OUTPUT"
          fi

      # The file names bundle.yml's matrix produces (docs/guides/release.md,
      # "Desktop bundles"), space-separated: exactly what `sign` signs and
      # `assets` requires. A platform missing here would be a bundle the
      # Release ships without.
      - name: Name the bundles
        id: names
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          test -n "$VERSION"
          echo "bundles=Delta_${VERSION}_aarch64.dmg delta-desktop_${VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"

  bundles:
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/bundle.yml
    with:
      ref: ${{ needs.target.outputs.sha }}
      release: true

  # The only job that can read the release signing key: the secret of the
  # `release-signing` environment, which only protected branches may use. It
  # holds no token, checks nothing out and runs no project code; it installs
  # minisign from a pinned release archive checked against the sha256 below,
  # signs exactly the bundle names `target` lists, verifies each signature
  # against the public key the desktop app compiles in, and hands the
  # signatures on as an artifact. The build jobs, which run project code,
  # never see the key. A dry run signs too, so the whole job is exercised.
  sign:
    needs: [target, bundles]
    if: ${{ !cancelled() && needs.target.result == 'success' && needs.bundles.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    permissions: {}
    env:
      VERSION: ${{ needs.target.outputs.version }}
      DRY_RUN: ${{ needs.target.outputs.dry_run }}
      BUNDLES: ${{ needs.target.outputs.bundles }}
      # minisign 0.12's Linux release archive (jedisct1/minisign), and its
      # sha256, taken when it was pinned (it also verified against the
      # author's minisign key then).
      MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
      # The public half of the signing key, as the desktop app and the update
      # helper compile it in (backend/crates/libs/release-signature). A
      # secret key that does not match it fails here, not in every app.
      MINISIGN_PUBLIC_KEY: RWSvjaqxlJm4wr9SiKBHDAlbhBASzeSf0dbg9loPJdgbTFQOEOX5J1Pl
    steps:
      # bundle.yml uploads one artifact per platform, delta-<matrix name>,
      # each holding that platform's single bundle file.
      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: delta-*
          path: bundles
          merge-multiple: true

      - name: Install minisign
        run: |
          archive="${RUNNER_TEMP}/minisign.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$archive" "$MINISIGN_URL"
          echo "${MINISIGN_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          echo "${RUNNER_TEMP}/minisign-linux/x86_64" >> "$GITHUB_PATH"

      # The trusted comment, which the signature covers, names the file and
      # the version; the app refuses a signature naming anything else. A dry
      # run's bundles carry the dispatched ref's real version in their file
      # names, but its signatures name the dry run's own version
      # (0.0.0-dryrun.<run id>): a dry-run bundle is signed with the
      # production key, and must never carry a signature the app would accept
      # as the release of that version. No release version is 0.0.0.
      - name: Sign the bundles
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The release-signing environment provides no MINISIGN_SECRET_KEY. See docs/guides/release.md (\"Signing\")."
            exit 1
          fi
          key="${RUNNER_TEMP}/release.key"
          trap 'rm -f "$key"' EXIT
          (
            umask 077
            # The secret holds the key file; a bare key line gets the
            # comment line minisign expects above it.
            case "$MINISIGN_SECRET_KEY" in
              "untrusted comment:"*) printf '%s\n' "$MINISIGN_SECRET_KEY" ;;
              *) printf 'untrusted comment: minisign secret key\n%s\n' "$MINISIGN_SECRET_KEY" ;;
            esac > "$key"
          )
          case "$DRY_RUN" in
            true) signed_version="0.0.0-dryrun.${GITHUB_RUN_ID}" ;;
            false) signed_version="$VERSION" ;;
            *)
              echo "::error::target says neither that this is a dry run nor that it is not (dry_run='${DRY_RUN}')."
              exit 1
              ;;
          esac
          mkdir signatures
          read -ra expected <<< "$BUNDLES"
          for name in "${expected[@]}"; do
            if [ ! -f "bundles/${name}" ]; then
              echo "::error::The bundles job produced no ${name}."
              exit 1
            fi
            comment="file:${name} version:${signed_version}"
            minisign -S -s "$key" -m "bundles/${name}" \
              -x "signatures/${name}.minisig" -t "$comment" < /dev/null
            verified=$(minisign -V -Q -P "$MINISIGN_PUBLIC_KEY" \
              -m "bundles/${name}" -x "signatures/${name}.minisig")
            if [ "$verified" != "$comment" ]; then
              echo "::error::The signature of ${name} does not verify with the app's public key as \"${comment}\"."
              exit 1
            fi
            echo "Signed ${name}: ${comment}"
          done

      - name: Upload the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-signatures
          path: signatures/*.minisig
          if-no-files-found: error
          # A re-run of the whole run signs again.
          overwrite: true

  # Gathers what the Release carries into the one artifact `publish` attaches.
  # Runs no project code and no third-party action besides download-artifact,
  # attest-build-provenance and upload-artifact, and cannot change the
  # repository or a Release. A failed bundle stops the run before this job,
  # so no Release is created; "Re-run failed jobs" rebuilds the failed
  # platforms, signs them and runs this job and `publish` again.
  assets:
    needs: [target, sign]
    if: ${{ !cancelled() && needs.target.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # GitHub artifact attestations of the bundles, and nothing else.
      id-token: write
      attestations: write
    env:
      BUNDLES: ${{ needs.target.outputs.bundles }}
    steps:
      # bundle.yml uploads one artifact per platform, delta-<matrix name>,
      # each holding that platform's single bundle file.
      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: delta-*
          path: assets
          merge-multiple: true

      - name: Download the signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-signatures
          path: assets

      # The app refuses an update without its signature, so a bundle must not
      # reach the Release without one; and every file here becomes an asset
      # of the Release, so nothing else may be here either.
      - name: Check every bundle and its signature, and nothing else, is here
        run: |
          read -ra expected <<< "$BUNDLES"
          missing=0
          for name in "${expected[@]}"; do
            for file in "$name" "${name}.minisig"; do
              if [ ! -f "assets/${file}" ]; then
                echo "::error::Nothing to attach as ${file}."
                missing=1
              fi
            done
          done
          for path in assets/*; do
            file="${path#assets/}"
            case " ${BUNDLES} " in
              *" ${file} "* | *" ${file%.minisig} "*) ;;
              *)
                echo "::error::${file} is neither a bundle nor a bundle's signature."
                missing=1
                ;;
            esac
          done
          ls -l assets
          exit "$missing"

      # Records, in GitHub's attestation store, which workflow run and commit
      # built each bundle (`gh attestation verify`). Not for a dry run: an
      # attestation is a lasting public statement, and a dry run may build
      # any protected ref.
      - name: Attest the bundles' build provenance
        if: ${{ needs.target.outputs.dry_run != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.dmg
            assets/*.deb

      # colophon attaches every file of this artifact to the Release. A dry
      # run uploads it too, as the one artifact to inspect.
      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/*
          if-no-files-found: error
          # A re-run gathers them again.
          overwrite: true

  # Tags the planned commit and publishes the Release with the summary written
  # in the release PR and every file of `release-assets` attached, in one
  # `gh release create`; then points the release PR's compare link at the tag.
  # Never on a dry run.
  publish:
    needs: [plan, assets]
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && needs.plan.outputs.released == 'true' && needs.assets.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    uses: x7c1/colophon/.github/workflows/release-publish.yml@a4d0af8d30a36d9978d393e28b540bdb3c641c6f # v0.3.0
    with:
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ needs.plan.outputs.sha }}
      pr-number: ${{ needs.plan.outputs.pr-number }}
      artifact-name: release-assets
