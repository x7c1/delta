name: Create Release PR

on:
  push:
    branches:
      - main
  pull_request:
    types: [edited]

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate both triggers:
    # - push: skip the commit that merged a release PR (its message starts
    #   with "Release v") — otherwise we'd loop, opening a new release PR
    #   for the very release that just landed.
    # - pull_request: only react to title edits (changes.title.from != null)
    #   on an open PR labelled `release`, so body-only edits and bot
    #   self-edits don't recurse.
    if: |
      (github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, 'Release v')) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.state == 'open' &&
        contains(github.event.pull_request.labels.*.name, 'release') &&
        github.event.changes.title.from != null)

    # The token that pushes and opens the PR is RELEASE_PAT, not
    # GITHUB_TOKEN, so the job's own token needs no write access.
    permissions:
      contents: read

    steps:
      # cargo-edit is built before the checkout, so its build runs with no
      # credentials on disk. It gives us `cargo set-version`, which is the
      # safest way to bump the workspace version: it understands
      # [workspace.package] boundaries so sed-style rewrites can't corrupt the
      # file. The version is fixed so a new release cannot change what runs
      # here unreviewed.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - name: Install cargo-edit
        run: cargo install cargo-edit@0.13.13 --locked

      # Both checkout's credential helper (used by the subsequent `git push`)
      # and the script's `gh pr create` must authenticate as the PAT user, not
      # as github-actions[bot]. GitHub's recursion-prevention rule does not
      # auto-trigger `pull_request` workflows on bot-authored PRs, so a PR
      # opened under GITHUB_TOKEN sits in `action_required` and never goes
      # green. The PAT makes the resulting PR user-authored, which lets CI /
      # Validate Release PR trigger on it normally.
      #
      # The credentials persist (no `persist-credentials: false`) because
      # create-release-pr.sh pushes the release branch with them.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Create or update release PR
        run: .github/scripts/create-release-pr.sh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
