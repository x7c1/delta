name: CI

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The fake-claude full-loop integration test drives a real tmux server;
      # it skips silently where tmux is absent, so install tmux explicitly to
      # guarantee CI always exercises it.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The TypeScript bindings in frontend/packages/gateway/wire-gen are
      # generated from the Rust wire contract and committed. Regenerate and
      # fail on any diff so a wire-contract change cannot land without its
      # regenerated bindings.
      - name: Check generated wire bindings are fresh
        run: |
          cargo run --locked -p delta-wire --bin export-ts
          if [ -n "$(git -C .. status --porcelain -- frontend/packages/gateway/wire-gen)" ]; then
            git -C .. --no-pager diff -- frontend/packages/gateway/wire-gen
            echo "error: generated wire bindings are stale — run 'make gen' and commit the result"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Single source of truth: the pnpm version comes from the
          # "packageManager" field in frontend/package.json. Do not also set
          # "version" here or action-setup errors on the conflict.
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Lint
        run: pnpm -r lint

      - name: Install Playwright browser
        run: pnpm --filter @delta/web exec playwright install --with-deps chromium

      - name: E2E (mock mode)
        run: pnpm --filter @delta/web e2e

      # Mock-mode e2e failures often surface only in CI and don't reproduce
      # locally, so on a failed run capture the Playwright output to make the
      # failure diagnosable after the runner is gone: test-results/ holds an
      # error-context.md (an ARIA page snapshot) per failure plus the trace
      # retained in CI. playwright-report/ (the HTML report) is not written
      # under CI's `github` reporter — the path is kept for parity with the
      # fake-mode upload and is harmlessly skipped by if-no-files-found: ignore,
      # which also stops the step erroring when a pre-e2e failure leaves nothing
      # to upload. The paths are repo-root-relative — upload-artifact ignores
      # the job's working-directory.
      - name: Upload e2e (mock mode) diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mock-diagnostics
          path: |
            frontend/packages/apps/web/playwright-report/
            frontend/packages/apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Fake-mode e2e: the real backend + tmux with the scripted fake-claude
  # binary behind it, driven by the browser. Complements (never replaces) the
  # mock-mode e2e job above: that one isolates the frontend, this one proves
  # the full loop (REST → spawn → tmux → hooks → transcript → tail → WS).
  e2e-fake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # The Vite dev server the suite boots resolves the workspace libraries
      # from their build output.
      - name: Build frontend workspace libraries
        run: pnpm -r build
        working-directory: frontend

      - name: Install Playwright browser
        run: pnpm --filter @delta/web exec playwright install --with-deps chromium
        working-directory: frontend

      - name: E2E (fake mode)
        run: make e2e-fake

      # These failures appear only in CI and don't reproduce locally, so on a
      # failed run capture every piece of evidence: the Playwright HTML report,
      # test-results/ (traces, videos, screenshots, and the preserved backend
      # logs + fake transcripts under e2e-fake/). A single run can span several
      # server generations across restarts, each logged to its own file
      # (server.log, server.2.log, …) that the worker fixture writes directly
      # under test-results/e2e-fake/, so uploading test-results/ wholesale
      # collects every generation. if-no-files-found: ignore keeps a green run
      # from erroring when nothing was produced.
      - name: Upload e2e-fake diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fake-diagnostics
          path: |
            frontend/packages/apps/web/playwright-report/
            frontend/packages/apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
