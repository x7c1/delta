name: CI

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]

# Read-only: no CI job writes to the repository.
permissions:
  contents: read

jobs:
  # Every action is pinned to a commit SHA (scripts/check-workflow-pins.sh);
  # `make check` runs both steps too.
  workflow-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every action is pinned to a commit SHA
        run: make check-workflow-pins

      - name: Test the pin check
        run: make check-workflow-pins-test

  # Known advisories in the dependencies that ship: the backend's lockfile
  # (backend/deny.toml says how unmaintained and yanked crates count) and the
  # frontend's production dependencies. Both fetch advisory data over the
  # network, so this runs here and as `make audit`, not in `make check`.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - name: Install cargo-deny
        run: cargo install cargo-deny@0.20.2 --locked

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Audit dependencies
        run: make audit

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # tmux is a hard prerequisite for this job: the composition root
      # probes for it at startup, so every test that wires the production root
      # fails without it — except the fake-claude full-loop test, which wires
      # that same root to drive a real tmux server but probes `PATH` itself
      # first and merely skips.
      # The runner image usually ships tmux already, so this rarely downloads
      # anything and its archives are not cached (unlike e2e-fake's).
      - name: Install tmux
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y tmux

      # A source file past 1000 lines mixes responsibilities. The check only
      # counts lines, so it runs before the build to fail fast.
      - name: Check no backend source file exceeds 1000 lines
        working-directory: .
        run: make check-backend-file-length

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The TypeScript bindings in frontend/packages/gateway/wire-gen are
      # generated from the Rust wire contract and committed. `make gen-check`
      # generates them into a temp dir and diffs that against the files on
      # disk; on this clean checkout those are the committed files, so a
      # wire-contract change cannot land without its regenerated bindings.
      - name: Check generated wire bindings are fresh
        working-directory: .
        run: make gen-check

      # The vendored `codex app-server` schema is stored key-sorted (`jq -S -j .`)
      # so a re-vendor diff shows the protocol changes rather than the
      # generator's unstable output order. This step only reads the committed
      # files — no codex binary, no network — and `jq` is preinstalled on the
      # runner image. `make check` runs the same check locally.
      - name: Check the vendored codex schema is key-sorted
        run: ../scripts/vendor-codex-schema.sh --check

      # The Release workflow decides whether to cut a release with
      # scripts/check-version-change.sh, and runs only after this workflow
      # passes on main. Testing the script here catches a break before it
      # reaches main. It builds scratch git repositories with a minimal
      # workspace and needs only git, cargo and jq — all on the runner.
      - name: Test the release version check
        working-directory: .
        run: make check-version-change-test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A source file past 1000 lines mixes responsibilities. The check only
      # counts lines, so it runs before the install to fail fast.
      - name: Check no frontend source file exceeds 1000 lines
        working-directory: .
        run: make check-frontend-file-length

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Single source of truth: the pnpm version comes from the
          # "packageManager" field in frontend/package.json. Do not also set
          # "version" here or action-setup errors on the conflict.
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Lint
        run: pnpm -r lint

      # The apt archive cache, as in the e2e-fake job (see the comment there).
      # This job installs no apt packages of its own: `--with-deps` below makes
      # Playwright install Chromium's system libraries, so the key holds the
      # Playwright version instead of a package list.
      - name: Prepare the apt archive cache
        id: apt-cache-key
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo chown "$(id -u):$(id -g)" /var/cache/apt/archives
          playwright_version=$(pnpm --filter @delta/web exec playwright --version | awk '/^Version /{print $2}')
          test -n "$playwright_version"
          prefix="apt-${{ runner.os }}-${ImageOS}-playwright-${playwright_version}-"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.apt-cache-key.outputs.prefix }}

      - name: Install Playwright browser
        run: |
          pnpm --filter @delta/web exec playwright install --with-deps chromium
          sudo apt-get autoclean
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec chmod a+r {} +

      - name: E2E (mock mode)
        run: pnpm --filter @delta/web e2e

      # Mock-mode e2e failures often surface only in CI and don't reproduce
      # locally, so on a failed run capture the Playwright output to make the
      # failure diagnosable after the runner is gone: test-results/ holds an
      # error-context.md (an ARIA page snapshot) per failure plus the trace
      # retained in CI. playwright-report/ (the HTML report) is not written
      # under CI's `github` reporter — the path is kept for parity with the
      # fake-mode upload and is harmlessly skipped by if-no-files-found: ignore,
      # which also stops the step erroring when a pre-e2e failure leaves nothing
      # to upload. The paths are repo-root-relative — upload-artifact ignores
      # the job's working-directory.
      - name: Upload e2e (mock mode) diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-mock-diagnostics
          path: |
            frontend/packages/apps/web/playwright-report/
            frontend/packages/apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Fake-mode e2e: the real backend + tmux with the scripted fake-claude and
  # fake-codex binaries behind it, driven by the browser. Complements (never
  # replaces) the mock-mode e2e job above: that one isolates the frontend, this
  # one proves the full loop (REST → spawn → tmux → hooks → transcript → tail → WS).
  e2e-fake:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # The apt packages the job installs; also part of their cache key.
      # tmux for the suite; the rest are the system libraries the desktop shell
      # (Tauri v2: WebKitGTK 4.1, GTK 3, the app-indicator and SVG libraries)
      # links against, for the shell build below.
      APT_PACKAGES: >-
        tmux
        libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
        librsvg2-dev libxdo-dev libssl-dev patchelf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The .deb archives are cached so a run normally installs from the cache
      # instead of the Ubuntu mirror, which has stalled these installs for over
      # 20 minutes. Only the downloads are cached: `apt-get update` and
      # `apt-get install` still run, so dpkg registers the packages and runs
      # their scripts as before, and apt re-downloads any cached archive that
      # does not match the signed index. The key holds the runner image (a new
      # image can ship different versions) and the package list; on a new image
      # the previous image's set for the same list is restored.
      #
      # The cache action runs as the runner user, so it is given the root-owned
      # archive directory (`lock` and `partial/` stay apt's), and apt must keep
      # what it downloads: drop the Docker-style clean hook if the image has one.
      #
      # bundle.yml and the frontend job above repeat these steps; keep them in
      # sync.
      - name: Prepare the apt archive cache
        id: apt-cache-key
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo chown "$(id -u):$(id -g)" /var/cache/apt/archives
          packages_hash=$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -c1-16)
          prefix="apt-${{ runner.os }}-${ImageOS}-${packages_hash}-"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.apt-cache-key.outputs.prefix }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y -o APT::Keep-Downloaded-Packages=true $APT_PACKAGES
          # Drop archives the current index no longer offers, so a cache saved
          # from a restored older set does not keep growing, and let the cache
          # action read what apt (as root) downloaded.
          sudo apt-get autoclean
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec chmod a+r {} +

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # The Vite dev server the suite boots resolves the workspace libraries
      # from their build output.
      - name: Build frontend workspace libraries
        run: pnpm -r build
        working-directory: frontend

      # The one job with both toolchains: the build above also produced the web
      # app's dist/, which delta-server's `embed-web` feature compiles in. This
      # proves the include and the static routes build against a real bundle
      # (`make check` runs the same step as check-embedded).
      - name: Build the embedded server
        run: cargo build --locked -p delta-server --features embed-web
        working-directory: backend

      # The desktop shell is outside the workspace's default members, so the
      # backend job never builds, tests or lints it. It embeds the same dist/
      # through delta-server's `embed-web` (`make check` runs the same step as
      # check-desktop-build).
      - name: Build, test and lint the desktop shell
        run: cargo build --locked -p delta-desktop && cargo test --locked -p delta-desktop && cargo clippy --locked -p delta-desktop --all-targets -- -D warnings
        working-directory: backend

      # Rustdoc over the whole workspace, private items included, with warnings
      # denied (`make check` runs the same step as check-backend-doc;
      # docs/guides/development/README.md says why one run suffices). It runs
      # here rather than in the backend job because `--workspace` takes in the
      # desktop shell, which needs the system libraries and the dist/ this job
      # provides.
      - name: Check the backend docs
        run: cargo doc --locked --workspace --no-deps --document-private-items
        working-directory: backend
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Install Playwright browser
        run: pnpm --filter @delta/web exec playwright install --with-deps chromium
        working-directory: frontend

      - name: E2E (fake mode)
        run: make e2e-fake

      # These failures appear only in CI and don't reproduce locally, so on a
      # failed run capture every piece of evidence: the Playwright HTML report,
      # test-results/ (the suite's output dir e2e-fake/ under it: traces,
      # videos, screenshots, and the preserved backend logs + fake
      # transcripts). A single run can boot the server more than once (a
      # worker reboot after a failed test) and each
      # boot can span several generations across restarts, so the worker
      # fixture gives every boot its own test-results/e2e-fake/boot-<N>/: one
      # log file per generation (server.log, server.2.log, …), written there
      # live so even a hard crash leaves them behind, plus transcripts/ copied
      # out on teardown (a hard-killed run has none). Uploading test-results/
      # wholesale collects every boot and generation. if-no-files-found: ignore
      # keeps a green run from erroring when nothing was produced.
      - name: Upload e2e-fake diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-fake-diagnostics
          path: |
            frontend/packages/apps/web/playwright-report/
            frontend/packages/apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
