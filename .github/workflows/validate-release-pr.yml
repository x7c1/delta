name: Validate Release PR

# Holds a release PR to its title and summary rules, through colophon's
# reusable workflow. Every other pull request passes, and so does the release
# PR while it is a draft: marking it ready for review is the decision to
# release, and runs the check. The check reads `validate / release-pr`, one of
# the required checks of main. See docs/guides/release.md.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

# Every job states what it needs.
permissions: {}

jobs:
  validate:
    permissions:
      contents: read
    uses: x7c1/colophon/.github/workflows/validate-release-pr.yml@a4d0af8d30a36d9978d393e28b540bdb3c641c6f # v0.3.0
    with:
      version-scheme: semver
