name: Bundle

# Builds the unsigned desktop bundles of the Tauri shell
# (backend/crates/apps/delta-desktop) and uploads each platform's bundle as a
# workflow artifact (delta-<matrix name>). It never touches a Release: the
# jobs hold read-only access, so nothing they run (an action, a build script,
# a dependency's install-time code) can change the Release the desktop app
# updates from. The Release workflow calls it and attaches the artifacts to
# its draft Release from a separate job. See docs/guides/release.md
# ("Desktop bundles").

on:
  workflow_call:
    inputs:
      ref:
        description: The commit SHA to build.
        type: string
        required: true
      release:
        description: >-
          Build for a Release: restore no backend/target cache, so a cache an
          ordinary CI run wrote cannot feed a release binary.
        type: boolean
        default: false
  pull_request:
    branches: [main, 'feat/**']
    paths:
      - backend/crates/apps/delta-desktop/**
      # The .deb carries the update helper.
      - backend/crates/apps/delta-update-helper/**
      # A tauri bump lands in the lockfile only, and the workspace manifest
      # carries the version the bundle file names use.
      - backend/Cargo.toml
      - backend/Cargo.lock
      - .github/workflows/bundle.yml
      - Makefile
      - frontend/**
  workflow_dispatch:
    inputs:
      ref:
        description: The ref (branch, tag or SHA) to build.
        type: string
        required: true

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      # The system libraries the shell (Tauri v2: WebKitGTK 4.1, GTK 3, the
      # app-indicator and SVG libraries) links against on Linux — the list
      # ci.yml installs for its shell build. Also part of their cache key.
      APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
        librsvg2-dev libxdo-dev libssl-dev patchelf

    # Read-only on every trigger: the bundles leave the job as workflow
    # artifacts, which need no token permission.
    permissions:
      contents: read

    strategy:
      # One broken platform must not hide whether the others still bundle.
      fail-fast: false
      matrix:
        include:
          # Apple silicon only: Intel Macs are not supported.
          - name: macos-aarch64
            runner: macos-26
            target: aarch64-apple-darwin
            bundles: dmg
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb

    steps:
      # The pull_request run builds the event's merge ref; the other two build
      # the ref they were given.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # The apt archive cache, as in ci.yml's e2e-fake job (see the comment there).
      - name: Prepare the apt archive cache
        if: runner.os == 'Linux'
        id: apt-cache-key
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo chown "$(id -u):$(id -g)" /var/cache/apt/archives
          packages_hash=$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -c1-16)
          prefix="apt-${{ runner.os }}-${ImageOS}-${packages_hash}-"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache apt archives
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.apt-cache-key.outputs.prefix }}

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y -o APT::Keep-Downloaded-Packages=true $APT_PACKAGES
          sudo apt-get autoclean
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec chmod a+r {} +

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Keyed per target: the release profile and the target directory differ
      # from ci.yml's debug builds, so sharing its cache would only evict it.
      # Pull requests and manual runs only: a release build compiles from
      # scratch (see the next step).
      - name: Cache cargo
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-bundle-${{ matrix.target }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-${{ matrix.target }}-

      # A release build caches the downloaded crate sources only, never
      # backend/target: compiled output another run wrote must not end up in
      # a release binary. The key is its own, so only release builds write
      # what a release build restores.
      - name: Cache the cargo registry
        if: ${{ inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-bundle-registry-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-registry-

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # tauri.conf.json has no build section: the shell embeds the web app's
      # dist/ through delta-server's `embed-web` feature, so the SPA has to be
      # built before `tauri build` compiles it in (as `make desktop-build` does).
      - name: Build the web app
        run: make web-dist

      # The .deb carries the update helper, which tauri.linux.conf.json takes
      # from backend/target/release/ (built for the host, which is the target
      # here), as `make desktop-build` builds it.
      - name: Build the update helper
        if: runner.os == 'Linux'
        run: cargo build --release -p delta-update-helper
        working-directory: backend

      # Given no token, releaseId, tagName or releaseName, the action only
      # builds: it can create, change or upload to no Release or tag.
      #
      # On the macOS runner, `hdiutil create` in the dmg step now and then fails
      # with "Resource busy" while something else on the runner still holds the
      # new disk image; the same build passes when run again. So on macOS a
      # failure here is retried once by the next step. The retry rebuilds from
      # the compiled target, so a real failure fails it too, a few minutes later.
      - name: Build the bundles
        id: tauri
        continue-on-error: ${{ runner.os == 'macOS' }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Marks the bundle as built by this workflow, the only build the
          # desktop app's Update may replace (every other build is `local`; see
          # docs/guides/development/README.md#build-origin).
          DELTA_BUILD_ORIGIN: release
        with:
          projectPath: backend/crates/apps/delta-desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false

      - name: Build the bundles (retry on macOS)
        id: tauri-retry
        if: steps.tauri.outcome == 'failure'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          DELTA_BUILD_ORIGIN: release
        with:
          projectPath: backend/crates/apps/delta-desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false

      # artifactPaths is a JSON array; upload-artifact takes one path per line.
      - name: List the bundle paths
        id: paths
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths || steps.tauri-retry.outputs.artifactPaths }}
        run: |
          delimiter="PATHS_$(openssl rand -hex 16)"
          {
            echo "list<<${delimiter}"
            jq -r '.[]' <<< "$ARTIFACT_PATHS"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # release.yml's publish job downloads these by name (delta-*).
      - name: Upload the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delta-${{ matrix.name }}
          path: ${{ steps.paths.outputs.list }}
          if-no-files-found: error
