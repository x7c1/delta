[workspace]
resolver = "2"
members = ["crates/*/*"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/x7c1/delta"

[workspace.dependencies]
# Internal crates
delta-attribution = { path = "crates/domain/delta-attribution" }
delta-model = { path = "crates/domain/delta-model" }
delta-usecase = { path = "crates/domain/delta-usecase" }
delta-sqlite = { path = "crates/gateway/delta-sqlite" }
delta-transcript = { path = "crates/gateway/delta-transcript" }
external-opener = { path = "crates/gateway/external-opener" }
tmux-driver = { path = "crates/gateway/tmux-driver" }
workspace-fs = { path = "crates/gateway/workspace-fs" }
git-worktree = { path = "crates/gateway/git-worktree" }
gh-cli = { path = "crates/gateway/gh-cli" }
binary-detector = { path = "crates/gateway/binary-detector" }
delta-wire = { path = "crates/gateway/delta-wire" }
codex-agent = { path = "crates/gateway/codex-agent" }
claude-agent = { path = "crates/gateway/claude-agent" }
agent-contract = { path = "crates/libs/agent-contract" }
delta-bootstrap = { path = "crates/libs/delta-bootstrap" }
delta-server = { path = "crates/apps/delta-server" }

# Shared third-party dependencies
anyhow = "1"
async-trait = "0.1"
# Default features include `clock`, which `Utc::now()` needs. No serde / wasm
# bits required for the current use (computing a date-naive cutoff for gh
# search queries).
chrono = "0.4"
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
ts-rs = "12"
