[workspace]
resolver = "2"
members = ["crates/*/*"]
# Everything except the desktop shell (`crates/apps/delta-desktop`), so a plain
# `cargo build` / `cargo test` / `cargo clippy` never pulls in Tauri and its
# system webview libraries. Build the shell by naming it: `cargo build -p
# delta-desktop` (or `make desktop-dev` / `make desktop`).
default-members = [
    "crates/apps/delta-server",
    "crates/apps/delta-update-helper",
    "crates/apps/fake-claude",
    "crates/apps/fake-codex",
    "crates/domain/*",
    "crates/gateway/*",
    "crates/libs/*",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/x7c1/delta"

[workspace.dependencies]
# Internal crates
delta-attribution = { path = "crates/domain/delta-attribution" }
delta-model = { path = "crates/domain/delta-model" }
delta-usecase = { path = "crates/domain/delta-usecase" }
delta-sqlite = { path = "crates/gateway/delta-sqlite" }
delta-transcript = { path = "crates/gateway/delta-transcript" }
external-opener = { path = "crates/gateway/external-opener" }
tmux-driver = { path = "crates/gateway/tmux-driver" }
workspace-fs = { path = "crates/gateway/workspace-fs" }
git-worktree = { path = "crates/gateway/git-worktree" }
gh-cli = { path = "crates/gateway/gh-cli" }
release-feed = { path = "crates/gateway/release-feed" }
update-installer = { path = "crates/gateway/update-installer" }
binary-detector = { path = "crates/gateway/binary-detector" }
delta-wire = { path = "crates/gateway/delta-wire" }
codex-agent = { path = "crates/gateway/codex-agent" }
claude-agent = { path = "crates/gateway/claude-agent" }
agent-contract = { path = "crates/libs/agent-contract" }
delta-bootstrap = { path = "crates/libs/delta-bootstrap" }
delta-server = { path = "crates/apps/delta-server" }

# Shared third-party dependencies
anyhow = "1"
async-trait = "0.1"
# Default features include `clock`, which `Utc::now()` needs. No serde / wasm
# bits required for the current use (computing a date-naive cutoff for gh
# search queries).
chrono = "0.4"
# The platform data directory (`~/Library/Application Support`, `$XDG_DATA_HOME`
# or `~/.local/share`), resolved the way Tauri's `app_data_dir()` resolves it —
# Tauri builds on this same crate — so the server's default data directory is
# the desktop app's.
dirs = "7"
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
# Compiles a directory tree into the binary (delta-server embeds the built web
# frontend with it under its `embed-web` feature).
include_dir = "0.7"
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
ts-rs = "12"
# SemVer precedence for comparing the newest published release's tag with this
# build's version.
semver = "1"
# The HTTPS client the release feed asks GitHub with. No default features: no
# OpenSSL and no bundled webpki roots reach the desktop bundle; TLS is rustls
# with the `ring` provider, verifying against the operating system's trust
# store through `rustls-platform-verifier` (see `crates/gateway/release-feed`).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# Verifies a downloaded release asset against the sha256 digest GitHub states
# for it, computed while the file streams in.
sha2 = "0.10"
# Reads the Info.plist of the Delta.app inside a downloaded macOS disk image
# (its bundle identifier and version) before it replaces the running app; the
# version Tauri itself builds on.
plist = "1"
