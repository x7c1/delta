[package]
name = "delta-desktop"
description = "Delta desktop shell: runs delta-server in-process and opens a webview on it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "delta-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
delta-bootstrap = { workspace = true }
delta-server = { workspace = true, features = ["embed-web"] }
anyhow = { workspace = true }
# The UTC day of the log file a write lands in (`logging::OwnerOnlyAppender`).
chrono = { workspace = true }
dirs = { workspace = true }
# `O_NOFOLLOW` for the log file created owner-only, and on macOS the user's
# temporary directory for the single-instance socket (`confstr`).
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The test that a `log` record reaches the log file.
log = { workspace = true }
tempfile = { workspace = true }
# The helper path the server runs, which the bundle config and the polkit
# policy must name too (tests/update_bundle.rs).
update-installer = { workspace = true }

# The macOS title bar (src/macos_title_bar.rs) talks to AppKit directly; these
# are the versions Tauri itself builds on.
# The window's app ID is set through GLib's program name (see
# `set_window_app_id` in src/main.rs), Ctrl-Q is caught on the GTK window
# (src/quit_shortcut.rs), and the window's content size is read from it
# (src/window_size/follow_resizes.rs); these are the versions Tauri builds on.
# A second launch's activation token is handed to GDK on the display it runs
# on (src/activation_token.rs): `gdkx11` for X11, and `gdkwayland-sys` for
# Wayland, which has no safe binding.
#
# `async-trait` implements the server's source of the activation token handed
# to each app it starts (`LaunchTokens` in src/activation_token.rs).
[target.'cfg(target_os = "linux")'.dependencies]
async-trait = { workspace = true }
gdkwayland-sys = "0.18"
gdkx11 = "0.18"
glib = "0.18"
gtk = "0.18"
# Turns the input method's uncommitted text back on in the webview
# (src/ime_preedit.rs). Pinned to the version wry uses, so no second copy is built.
webkit2gtk = { version = "=2.0.2", features = ["v2_28"] }
# Single-instance over the session D-Bus. macOS uses the shell's own lock
# (src/single_instance), as the plugin's socket there is in the shared `/tmp`.
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSUserDefaults"] }
