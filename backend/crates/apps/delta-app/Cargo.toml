[package]
name = "delta-app"
description = "Delta desktop shell: runs delta-server in-process and opens a webview on it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "delta-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
delta-bootstrap = { workspace = true }
delta-server = { workspace = true, features = ["embed-web"] }
anyhow = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { workspace = true }
tracing = { workspace = true }
