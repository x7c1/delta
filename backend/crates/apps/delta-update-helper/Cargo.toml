[package]
name = "delta-update-helper"
description = "Installs a downloaded update of the Delta desktop app on Linux, as root through polkit, after verifying it itself"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "delta-update-helper"
path = "src/main.rs"

# Kept to what the checks need: the helper runs as root, so it shares no code
# with Delta's server and trusts nothing its caller says beyond the version and
# the file. The HTTPS client is rustls with `ring`, set up on its own: it
# trusts only the system's CA bundle at its fixed path, read with rustls's own
# PEM parser, so no variable such as `SSL_CERT_FILE` can add a certificate.
# The one crate it shares with the desktop app is `release-signature`, so both
# check against the same compiled-in release key.
[dependencies]
libc = { workspace = true }
release-signature = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
release-signature = { workspace = true, features = ["testing"] }
