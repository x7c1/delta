[package]
name = "release-feed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
delta-usecase = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
# Verifies GitHub's certificate against the operating system's trust store
# (the Keychain on macOS, the system CA store on Linux) rather than roots
# bundled into the binary, so a network that re-signs TLS with a CA the user
# installed still works.
rustls-platform-verifier = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
