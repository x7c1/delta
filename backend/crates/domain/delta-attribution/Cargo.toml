[package]
name = "delta-attribution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
delta-model = { workspace = true }
# A background `Agent`/`Task`/`Bash` tool_use carries its `run_in_background`
# flag inside the `serde_json::Value` tool input (the same type `delta-model`'s
# `ContentBlock::ToolUse.input` holds), which `claude_format` inspects.
serde_json = { workspace = true }

[dev-dependencies]
# The golden-corpus tests feed sanitized raw JSONL fixtures through the real
# transcript parser (`delta_transcript::parse_line`) before folding, so the
# corpus pins the parser→fold pipeline, not a hand-rolled re-encoding. A
# dev-dependency cycle through delta-usecase is fine: it only affects test
# builds.
delta-transcript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
