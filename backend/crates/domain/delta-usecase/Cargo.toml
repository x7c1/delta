[package]
name = "delta-usecase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
delta-attribution = { workspace = true }
delta-model = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Only the async Mutex used to serialize transcript ingestion; the runtime and
# the rest of tokio come from the binary crate.
tokio = { workspace = true, features = ["sync"] }
# Mints the session id Delta pins via `claude --session-id` at spawn time.
uuid = { workspace = true }
# Parses the stored `AskUserQuestion` tool input (`{"questions":[…]}`) into the
# shapes the key-sequence generator needs.
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
