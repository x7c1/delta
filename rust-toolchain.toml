# The Rust toolchain every `cargo` call in this repository uses, locally and in
# CI. rustup installs it (with these components) on first use; Dependabot
# raises the version in a pull request when a new Rust release is out. See
# docs/guides/development/README.md ("Rust toolchain").
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
